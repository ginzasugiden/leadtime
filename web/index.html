<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リードタイム修正侍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #fafaf5;
    color: #2d3a2e;
    min-height: 100vh;
  }

  /* ── Login Screen ── */
  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a3c2a 0%, #2d5a27 60%, #3a6b35 100%);
  }
  .login-box {
    background: #fff;
    border-radius: 12px;
    padding: 2.5rem 2rem;
    width: 360px;
    max-width: 90vw;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
    text-align: center;
  }
  .login-box h1 {
    font-size: 1.6rem;
    color: #2d5a27;
    letter-spacing: 0.15em;
    margin-bottom: 0.3rem;
  }
  .login-box .login-sub {
    font-size: 0.8rem;
    color: #999;
    margin-bottom: 2rem;
  }
  .login-box .form-group {
    margin-bottom: 1rem;
    text-align: left;
  }
  .login-box label {
    display: block;
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 0.3rem;
  }
  .login-box input {
    width: 100%;
    padding: 0.7rem 0.8rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
    font-family: inherit;
    transition: border-color .2s;
  }
  .login-box input:focus {
    outline: none;
    border-color: #2d5a27;
  }
  .login-box .btn-login {
    width: 100%;
    padding: 0.8rem;
    margin-top: 0.5rem;
    background: #2d5a27;
    color: #c9a84c;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background .2s;
  }
  .login-box .btn-login:hover { background: #3a6b35; }
  .login-box .btn-login:disabled { background: #999; cursor: not-allowed; }
  .login-error {
    color: #c44;
    font-size: 0.85rem;
    margin-top: 0.8rem;
    min-height: 1.2em;
  }

  /* ── App (hidden until login) ── */
  .app { display: none; }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1a3c2a, #2d5a27);
    color: #c9a84c;
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .header h1 {
    font-size: 1.4rem;
    letter-spacing: 0.15em;
  }
  .header .shop-name {
    font-size: 0.85rem;
    color: #b8d4b0;
    margin-left: 0.5rem;
  }
  .header .spacer { flex: 1; }
  .btn-logout {
    padding: 0.4rem 1rem;
    background: transparent;
    border: 1px solid #c9a84c;
    color: #c9a84c;
    border-radius: 4px;
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-logout:hover { background: rgba(201,168,76,.15); }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    background: #2d5a27;
  }
  .tab-btn {
    flex: 1;
    padding: 0.75rem 1rem;
    border: none;
    background: transparent;
    color: #b8c9b0;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background .2s, color .2s;
    font-family: inherit;
    letter-spacing: 0.08em;
  }
  .tab-btn:hover { background: rgba(255,255,255,.08); }
  .tab-btn.active {
    background: #fafaf5;
    color: #1a3c2a;
    font-weight: 700;
  }

  /* ── Tab Content ── */
  .tab-content { display: none; padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
  .tab-content.active { display: block; }

  /* ── Card ── */
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    border-left: 4px solid #c9a84c;
  }
  .card h2 {
    font-size: 1.1rem;
    color: #1a3c2a;
    margin-bottom: 1rem;
    border-bottom: 1px solid #e0ddd4;
    padding-bottom: 0.5rem;
  }

  /* ── Forms ── */
  .form-row {
    display: flex;
    gap: 0.8rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .form-row label { white-space: nowrap; font-size: 0.9rem; }
  input[type="text"], select {
    padding: 0.6rem 0.8rem;
    border: 1px solid #c5c0b0;
    border-radius: 4px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #fafaf5;
    transition: border-color .2s;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: #2d5a27;
  }
  input[type="text"] { flex: 1; min-width: 200px; }

  .btn {
    padding: 0.6rem 1.5rem;
    border: none;
    border-radius: 4px;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: background .2s, transform .1s;
    letter-spacing: 0.05em;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #1a3c2a; color: #c9a84c; }
  .btn-primary:hover { background: #2d5a27; }
  .btn-primary:disabled { background: #999; cursor: not-allowed; }
  .btn-gold { background: #c9a84c; color: #fff; }
  .btn-gold:hover { background: #b09540; }
  .btn-gold:disabled { background: #ccc; cursor: not-allowed; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; margin-top: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th {
    background: #1a3c2a;
    color: #c9a84c;
    padding: 0.6rem 0.8rem;
    text-align: left;
    white-space: nowrap;
    font-weight: 600;
  }
  td {
    padding: 0.5rem 0.8rem;
    border-bottom: 1px solid #e8e5dc;
    word-break: break-all;
  }
  tr:hover td { background: #f0ede4; }

  /* ── Status ── */
  .status {
    padding: 0.7rem 1rem;
    border-radius: 4px;
    margin-top: 1rem;
    font-size: 0.9rem;
    display: none;
  }
  .status.info    { display: block; background: #e8f0e8; color: #1a3c2a; border: 1px solid #b8d4b8; }
  .status.error   { display: block; background: #f8e8e8; color: #8b2020; border: 1px solid #d4b8b8; }
  .status.loading { display: block; background: #f0ede4; color: #6b6040; border: 1px solid #d4d0c0; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #c9a84c;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 0.4rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Schedule ── */
  .schedule-table td, .schedule-table th { text-align: center; padding: 0.6rem 1rem; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .header { padding: 0.8rem 1rem; flex-wrap: wrap; }
    .header h1 { font-size: 1.1rem; }
    .tab-btn { font-size: 0.8rem; padding: 0.6rem 0.5rem; }
    .tab-content { padding: 1rem; }
    .card { padding: 1rem; }
  }
</style>
</head>
<body>

<!-- ===== Login Screen ===== -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>リードタイム修正侍</h1>
    <p class="login-sub">楽天RMS リードタイム管理ツール</p>
    <div class="form-group">
      <label for="login-id">ID</label>
      <input type="text" id="login-id" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="login-pw">パスワード</label>
      <input type="password" id="login-pw" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ===== App ===== -->
<div class="app" id="app">

  <!-- Header -->
  <div class="header">
    <h1>リードタイム修正侍</h1>
    <span class="shop-name" id="shop-name"></span>
    <div class="spacer"></div>
    <button class="btn-logout" id="btn-logout">ログアウト</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="lt">リードタイム変更</button>
    <button class="tab-btn" data-tab="schedule">スケジュール</button>
  </div>

  <!-- リードタイム変更タブ -->
  <div id="tab-lt" class="tab-content active">
    <div class="card">
      <h2>リードタイム変更</h2>
      <div id="lt-init-status" class="status"></div>
      <div id="lt-search-area" style="display:none;">
        <div class="form-row">
          <input type="text" id="lt-keyword" placeholder="管理番号 または 商品名で検索">
          <button class="btn btn-primary" id="btn-lt-search">検索</button>
        </div>
        <div id="lt-search-status" class="status"></div>
        <div id="lt-result-area" style="display:none;">
          <div class="form-row" style="margin-top:0.5rem; gap:0.5rem;">
            <button class="btn btn-primary" id="btn-select-all" style="padding:0.4rem 1rem;font-size:0.85rem;">全選択</button>
            <button class="btn" id="btn-deselect-all" style="padding:0.4rem 1rem;font-size:0.85rem;background:#e8e5dc;">選択解除</button>
            <span id="lt-result-count" style="font-size:0.85rem;color:#888;margin-left:auto;align-self:center;"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:2rem;"><input type="checkbox" id="chk-all"></th>
                  <th>管理番号</th>
                  <th>バリエーションID</th>
                  <th>商品名</th>
                  <th>在庫あり時LT</th>
                  <th>在庫切れ時LT</th>
                </tr>
              </thead>
              <tbody id="lt-results"></tbody>
            </table>
          </div>
          <div class="form-row" style="margin-top:1rem;">
            <button class="btn btn-gold" id="btn-apply" disabled>選択した商品を更新</button>
          </div>
          <div id="apply-status" class="status"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- スケジュールタブ -->
  <div id="tab-schedule" class="tab-content">
    <div class="card">
      <h2>自動更新スケジュール</h2>
      <div id="sched-status" class="status"></div>

      <!-- スケジュール一覧テーブル -->
      <div class="table-wrap" id="sched-table-wrap" style="display:none;">
        <table id="sched-table">
          <thead>
            <tr>
              <th>管理番号</th>
              <th>タイミング</th>
              <th>時刻</th>
              <th>変更後LT</th>
              <th style="width:5rem;"></th>
            </tr>
          </thead>
          <tbody id="sched-results"></tbody>
        </table>
      </div>

      <!-- 追加・編集フォーム -->
      <div class="card" id="sched-form-card" style="margin-top:1rem;display:none;">
        <h2 id="sched-form-title">スケジュール追加</h2>
        <input type="hidden" id="sched-edit-index" value="">

        <div class="form-row">
          <label>管理番号</label>
          <input type="text" id="sched-manage-number" placeholder="例: yellowrose100" style="max-width:220px;">
        </div>
        <div class="form-row">
          <label>タイミング</label>
          <select id="sched-timing" style="min-width:120px;">
            <option value="weekly">週次</option>
            <option value="yearly">年次（特定日）</option>
          </select>
        </div>
        <div id="sched-weekly-row" class="form-row">
          <label>曜日</label>
          <select id="sched-weekday" style="min-width:100px;">
            <option value="0">日曜</option>
            <option value="1">月曜</option>
            <option value="2">火曜</option>
            <option value="3">水曜</option>
            <option value="4">木曜</option>
            <option value="5">金曜</option>
            <option value="6">土曜</option>
          </select>
        </div>
        <div id="sched-yearly-row" class="form-row" style="display:none;">
          <label>月</label>
          <input type="number" id="sched-month" min="1" max="12" style="width:60px;">
          <label style="margin-left:0.5rem;">日</label>
          <input type="number" id="sched-date" min="1" max="31" style="width:60px;">
        </div>
        <div class="form-row">
          <label>時刻</label>
          <select id="sched-hour" style="min-width:100px;">
            <!-- 0〜23時 JSで生成 -->
          </select>
        </div>
        <div class="form-row">
          <label>変更後LT</label>
          <select id="sched-lt-name" style="min-width:180px;"></select>
        </div>

        <!-- 重複アラート -->
        <div id="sched-conflict-alert" style="display:none;margin:0.8rem 0;padding:0.8rem;background:#fff3cd;border:1px solid #ffc107;border-radius:4px;font-size:0.9rem;"></div>

        <div class="form-row" style="margin-top:1rem;">
          <button class="btn btn-primary" id="btn-sched-save">保存</button>
          <button class="btn" id="btn-sched-cancel" style="background:#e8e5dc;margin-left:0.5rem;">キャンセル</button>
        </div>
      </div>

      <div class="form-row" style="margin-top:1rem;">
        <button class="btn btn-primary" id="btn-sched-add">＋ スケジュール追加</button>
      </div>
      <div id="sched-save-status" class="status"></div>
    </div>
  </div>

</div><!-- /.app -->

<script>
// ── GAS Web App URL（デプロイ後に差し替え） ──
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxsWq3cKOCzHvGpEmvB-PM0MQzR0opgiJEy9vnUt4hfOP7UvdaCqTm8iViB3f4QzNSusg/exec';

// ── Session ──
function getToken() { return sessionStorage.getItem('token'); }
function setToken(t) { sessionStorage.setItem('token', t); }
function clearToken() { sessionStorage.removeItem('token'); sessionStorage.removeItem('sname'); }

// ── Helpers ──
function showStatus(el, type, msg) {
  el.className = 'status ' + type;
  el.innerHTML = (type === 'loading' ? '<span class="spinner"></span>' : '') + escapeHtml(msg);
}
function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

var _jsonpCounter = 0;

function callGas(action, params) {
  return new Promise(function(resolve, reject) {
    var cbName = '_jsonpCb_' + (++_jsonpCounter) + '_' + Date.now();

    var qs = new URLSearchParams();
    qs.set('action', action);
    qs.set('callback', cbName);
    var token = getToken();
    if (token) qs.set('token', token);

    if (params) {
      Object.keys(params).forEach(function(k) {
        var v = params[k];
        qs.set(k, (typeof v === 'object') ? JSON.stringify(v) : v);
      });
    }

    // コールバック関数をグローバルに登録
    window[cbName] = function(data) {
      delete window[cbName];
      script.parentNode && script.parentNode.removeChild(script);
      if (data && data.status === 401) {
        clearToken();
        showLogin();
      }
      resolve(data);
    };

    var script = document.createElement('script');
    script.src = GAS_URL + '?' + qs.toString();
    script.onerror = function() {
      delete window[cbName];
      script.parentNode && script.parentNode.removeChild(script);
      reject(new Error('通信エラー'));
    };
    document.body.appendChild(script);
  });
}

// ── Screen switching ──
function showLogin() {
  document.getElementById('login-screen').style.display = '';
  document.getElementById('app').style.display = 'none';
}
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('shop-name').textContent = sessionStorage.getItem('sname') || '';
  loadLtList();
}

// ── Init: check session ──
if (getToken()) {
  showApp();
} else {
  showLogin();
}

// ── Login ──
var loginBtn = document.getElementById('btn-login');
var loginId = document.getElementById('login-id');
var loginPw = document.getElementById('login-pw');
var loginError = document.getElementById('login-error');

loginBtn.addEventListener('click', doLogin);
loginPw.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
loginId.addEventListener('keydown', function(e) { if (e.key === 'Enter') loginPw.focus(); });

function doLogin() {
  var id = loginId.value.trim();
  var pw = loginPw.value;
  if (!id || !pw) { loginError.textContent = 'IDとパスワードを入力してください'; return; }

  loginBtn.disabled = true;
  loginError.textContent = '';

  callGas('login', { userId: id, password: pw })
    .then(function(data) {
      loginBtn.disabled = false;
      if (data.error) {
        loginError.textContent = data.error;
        return;
      }
      setToken(data.token);
      sessionStorage.setItem('sname', data.sname || '');
      showApp();
    })
    .catch(function(err) {
      loginBtn.disabled = false;
      loginError.textContent = '通信エラー: ' + err.message;
    });
}

// ── Logout ──
document.getElementById('btn-logout').addEventListener('click', function() {
  callGas('logout').catch(function() {});
  clearToken();
  loginId.value = '';
  loginPw.value = '';
  loginError.textContent = '';
  showLogin();
});

// ── Tab switching ──
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── LT一覧（自動取得）──
var ltList = [];

function loadLtList() {
  showStatus(document.getElementById('lt-init-status'), 'loading', 'リードタイム一覧を取得中...');
  callGas('getLeadTimeList')
    .then(function(data) {
      if (data.error) {
        showStatus(document.getElementById('lt-init-status'), 'error', 'LT一覧取得失敗: ' + data.error);
        return;
      }
      ltList = data.leadTimeList || [];
      document.getElementById('lt-init-status').className = 'status';
      document.getElementById('lt-search-area').style.display = '';
    })
    .catch(function(err) {
      showStatus(document.getElementById('lt-init-status'), 'error', '通信エラー: ' + err.message);
    });
}

// ── 商品検索（LT付き）──
var bulkItems = [];

document.getElementById('btn-lt-search').addEventListener('click', doLtSearch);
document.getElementById('lt-keyword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLtSearch();
});

function doLtSearch() {
  var keyword = document.getElementById('lt-keyword').value.trim();
  if (!keyword) return;
  var btn = document.getElementById('btn-lt-search');
  btn.disabled = true;
  showStatus(document.getElementById('lt-search-status'), 'loading', '検索中（件数によっては時間がかかります）...');
  document.getElementById('lt-result-area').style.display = 'none';

  callGas('searchItemsWithLT', { keyword: keyword })
    .then(function(data) {
      btn.disabled = false;
      if (data.error) { showStatus(document.getElementById('lt-search-status'), 'error', data.error); return; }
      bulkItems = data.items || [];
      if (bulkItems.length === 0) { showStatus(document.getElementById('lt-search-status'), 'info', '検索結果なし'); return; }
      document.getElementById('lt-search-status').className = 'status';
      renderLtResults(bulkItems, ltList);
    })
    .catch(function(err) {
      btn.disabled = false;
      showStatus(document.getElementById('lt-search-status'), 'error', '通信エラー: ' + err.message);
    });
}

function buildLtSelect(name, list, currentValue) {
  var html = '<select name="' + name + '" data-original="' + (currentValue || '') + '" style="font-size:0.9em;">';
  html += '<option value="">-- 未設定 --</option>';
  for (var i = 0; i < list.length; i++) {
    var lt = list[i];
    var selected = (currentValue != null && currentValue !== '' && String(lt.id) === String(currentValue)) ? ' selected' : '';
    html += '<option value="' + lt.id + '"' + selected + '>' + lt.name + '</option>';
  }
  html += '</select>';
  return html;
}

function renderLtResults(items, list) {
  document.getElementById('lt-result-count').textContent = items.length + '件';
  var tbody = document.getElementById('lt-results');
  tbody.innerHTML = '';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var tr = document.createElement('tr');
    tr.setAttribute('data-manage-number', it.manageNumber);
    tr.setAttribute('data-variant-id', it.variantId || '');
    tr.innerHTML =
      '<td style="text-align:center;"><input type="checkbox" class="row-chk"></td>' +
      '<td>' + escapeHtml(it.manageNumber) + '</td>' +
      '<td>' + escapeHtml(it.variantId || '') + '</td>' +
      '<td>' + escapeHtml((it.title || '').substring(0, 40)) + '</td>' +
      '<td>' + buildLtSelect('normal-' + i, list, it.normalDeliveryTimeId) + '</td>' +
      '<td>' + buildLtSelect('backorder-' + i, list, it.backOrderDeliveryTimeId) + '</td>';
    tbody.appendChild(tr);
  }
  document.getElementById('lt-result-area').style.display = '';
  document.getElementById('btn-apply').disabled = false;
}

// ── チェックボックス全選択・解除 ──
document.getElementById('chk-all').addEventListener('change', function() {
  var checked = this.checked;
  document.querySelectorAll('#lt-results .row-chk').forEach(function(chk) { chk.checked = checked; });
});
document.getElementById('btn-select-all').addEventListener('click', function() {
  document.querySelectorAll('#lt-results .row-chk').forEach(function(chk) { chk.checked = true; });
  document.getElementById('chk-all').checked = true;
});
document.getElementById('btn-deselect-all').addEventListener('click', function() {
  document.querySelectorAll('#lt-results .row-chk').forEach(function(chk) { chk.checked = false; });
  document.getElementById('chk-all').checked = false;
});

// ── ドロップダウン変更ハイライト ──
document.addEventListener('change', function(e) {
  if (e.target.tagName === 'SELECT' && e.target.closest('#lt-results')) {
    var original = e.target.getAttribute('data-original');
    e.target.style.backgroundColor = (e.target.value !== original) ? '#fff3cd' : '';
  }
});

// ── 更新ボタン ──
document.getElementById('btn-apply').addEventListener('click', function() {
  var rows = document.querySelectorAll('#lt-results tr[data-manage-number]');
  var changedItems = [];
  rows.forEach(function(row, index) {
    var chk = row.querySelector('.row-chk');
    if (!chk || !chk.checked) return;
    var manageNumber = row.getAttribute('data-manage-number');
    var variantId = row.getAttribute('data-variant-id');
    var normalSelect = row.querySelector('select[name="normal-' + index + '"]');
    var backorderSelect = row.querySelector('select[name="backorder-' + index + '"]');
    var item = { manageNumber: manageNumber, variantId: variantId };
    if (normalSelect && normalSelect.value !== normalSelect.getAttribute('data-original')) {
      item.normalDeliveryTimeId = normalSelect.value ? Number(normalSelect.value) : null;
    }
    if (backorderSelect && backorderSelect.value !== backorderSelect.getAttribute('data-original')) {
      item.backOrderDeliveryTimeId = backorderSelect.value ? Number(backorderSelect.value) : null;
    }
    if (item.normalDeliveryTimeId !== undefined || item.backOrderDeliveryTimeId !== undefined) {
      changedItems.push(item);
    }
  });
  if (changedItems.length === 0) {
    showStatus(document.getElementById('apply-status'), 'info', 'チェックした商品の中に変更がありません');
    return;
  }
  var applyBtn = document.getElementById('btn-apply');
  applyBtn.disabled = true;
  showStatus(document.getElementById('apply-status'), 'loading', changedItems.length + '件を更新中...');
  callGas('updateLeadTime', { items: changedItems })
    .then(function(data) {
      applyBtn.disabled = false;
      if (data.error) { showStatus(document.getElementById('apply-status'), 'error', data.error); return; }
      var results = data.results || [];
      var ok = results.filter(function(r) { return r.success; }).length;
      var ng = results.length - ok;
      showStatus(document.getElementById('apply-status'), ng > 0 ? 'error' : 'info',
        '完了: 成功 ' + ok + '件' + (ng > 0 ? ' / 失敗 ' + ng + '件' : ''));
    })
    .catch(function(err) {
      applyBtn.disabled = false;
      showStatus(document.getElementById('apply-status'), 'error', '通信エラー: ' + err.message);
    });
});

// ── スケジュールタブ ──
var schedules = [];
var WEEKDAY_NAMES = ['日曜', '月曜', '火曜', '水曜', '木曜', '金曜', '土曜'];

// 時刻セレクト初期化
(function() {
  var sel = document.getElementById('sched-hour');
  for (var h = 0; h < 24; h++) {
    var opt = document.createElement('option');
    opt.value = h;
    opt.textContent = h + ':00';
    sel.appendChild(opt);
  }
})();

// タイミング切替
document.getElementById('sched-timing').addEventListener('change', function() {
  var isYearly = this.value === 'yearly';
  document.getElementById('sched-weekly-row').style.display = isYearly ? 'none' : '';
  document.getElementById('sched-yearly-row').style.display = isYearly ? '' : 'none';
});

// タブ切替時にスケジュール読み込み
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    if (btn.dataset.tab === 'schedule') loadSchedules();
  });
});

function loadSchedules() {
  showStatus(document.getElementById('sched-status'), 'loading', 'スケジュールを読み込み中...');
  callGas('getSchedules')
    .then(function(data) {
      if (data.error) { showStatus(document.getElementById('sched-status'), 'error', data.error); return; }
      schedules = data.schedules || [];
      document.getElementById('sched-status').className = 'status';
      renderSchedules(schedules);
    })
    .catch(function(err) {
      showStatus(document.getElementById('sched-status'), 'error', '通信エラー: ' + err.message);
    });
}

function renderSchedules(list) {
  var tbody = document.getElementById('sched-results');
  tbody.innerHTML = '';
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">スケジュールなし</td></tr>';
    document.getElementById('sched-table-wrap').style.display = '';
    return;
  }
  list.forEach(function(sc) {
    var timingLabel = sc.timing === 'weekly'
      ? '毎週' + WEEKDAY_NAMES[sc.weekday]
      : sc.month + '月' + sc.date + '日';
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + escapeHtml(sc.manageNumber) + '</td>' +
      '<td>' + escapeHtml(timingLabel) + '</td>' +
      '<td>' + sc.hour + ':00</td>' +
      '<td>' + escapeHtml(sc.ltName) + '</td>' +
      '<td>' +
        '<button class="btn btn-primary" style="padding:0.3rem 0.6rem;font-size:0.8rem;margin-right:4px;" onclick="editSchedule(' + sc.index + ')">編集</button>' +
        '<button class="btn" style="padding:0.3rem 0.6rem;font-size:0.8rem;background:#f8e8e8;color:#8b2020;" onclick="deleteSchedule(' + sc.index + ')">削除</button>' +
      '</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('sched-table-wrap').style.display = '';
}

// 重複チェック
function checkConflicts(manageNumber, timing, weekday, month, date, hour, excludeIndex) {
  var conflicts = [];
  schedules.forEach(function(sc) {
    if (sc.index === excludeIndex) return;
    if (sc.manageNumber !== manageNumber) return;
    var sameTime = false;
    if (sc.timing === 'weekly' && timing === 'weekly' && sc.weekday === weekday && sc.hour === hour) sameTime = true;
    if (sc.timing === 'yearly' && timing === 'yearly' && sc.month === month && sc.date === date && sc.hour === hour) sameTime = true;
    if (sameTime) conflicts.push(sc);
  });
  return conflicts;
}

function showConflictAlert(conflicts) {
  var el = document.getElementById('sched-conflict-alert');
  if (conflicts.length === 0) { el.style.display = 'none'; return; }
  var msg = '⚠️ 以下の設定と重複があります。続けてよいですか？<br>';
  conflicts.forEach(function(sc) {
    var t = sc.timing === 'weekly' ? '毎週' + WEEKDAY_NAMES[sc.weekday] : sc.month + '月' + sc.date + '日';
    msg += '<br>・' + escapeHtml(sc.manageNumber) + ' / ' + t + ' ' + sc.hour + ':00 → ' + escapeHtml(sc.ltName);
  });
  el.innerHTML = msg;
  el.style.display = '';
}

// 追加ボタン
document.getElementById('btn-sched-add').addEventListener('click', function() {
  document.getElementById('sched-form-title').textContent = 'スケジュール追加';
  document.getElementById('sched-edit-index').value = '';
  document.getElementById('sched-manage-number').value = '';
  document.getElementById('sched-timing').value = 'weekly';
  document.getElementById('sched-weekday').value = '0';
  document.getElementById('sched-month').value = '';
  document.getElementById('sched-date').value = '';
  document.getElementById('sched-hour').value = '13';
  document.getElementById('sched-weekly-row').style.display = '';
  document.getElementById('sched-yearly-row').style.display = 'none';
  document.getElementById('sched-conflict-alert').style.display = 'none';
  populateSchedLtSelect('');
  document.getElementById('sched-form-card').style.display = '';
  document.getElementById('sched-save-status').className = 'status';
});

function editSchedule(index) {
  var sc = schedules.find(function(s) { return s.index === index; });
  if (!sc) return;
  document.getElementById('sched-form-title').textContent = 'スケジュール編集';
  document.getElementById('sched-edit-index').value = sc.index;
  document.getElementById('sched-manage-number').value = sc.manageNumber;
  document.getElementById('sched-timing').value = sc.timing;
  document.getElementById('sched-weekday').value = sc.weekday;
  document.getElementById('sched-month').value = sc.month || '';
  document.getElementById('sched-date').value = sc.date || '';
  document.getElementById('sched-hour').value = sc.hour;
  var isYearly = sc.timing === 'yearly';
  document.getElementById('sched-weekly-row').style.display = isYearly ? 'none' : '';
  document.getElementById('sched-yearly-row').style.display = isYearly ? '' : 'none';
  document.getElementById('sched-conflict-alert').style.display = 'none';
  populateSchedLtSelect(sc.ltName);
  document.getElementById('sched-form-card').style.display = '';
  document.getElementById('sched-save-status').className = 'status';
}

function populateSchedLtSelect(currentName) {
  var sel = document.getElementById('sched-lt-name');
  sel.innerHTML = '';
  ltList.forEach(function(lt) {
    var opt = document.createElement('option');
    opt.value = lt.name;
    opt.textContent = lt.name;
    if (lt.name === currentName) opt.selected = true;
    sel.appendChild(opt);
  });
}

// 保存ボタン
document.getElementById('btn-sched-save').addEventListener('click', function() {
  var manageNumber = document.getElementById('sched-manage-number').value.trim();
  var timing   = document.getElementById('sched-timing').value;
  var weekday  = Number(document.getElementById('sched-weekday').value);
  var month    = Number(document.getElementById('sched-month').value) || '';
  var date     = Number(document.getElementById('sched-date').value) || '';
  var hour     = Number(document.getElementById('sched-hour').value);
  var ltName   = document.getElementById('sched-lt-name').value;
  var editIndex = document.getElementById('sched-edit-index').value;

  if (!manageNumber) { showStatus(document.getElementById('sched-save-status'), 'error', '管理番号を入力してください'); return; }
  if (timing === 'yearly' && (!month || !date)) { showStatus(document.getElementById('sched-save-status'), 'error', '月・日を入力してください'); return; }

  // 重複チェック
  var conflicts = checkConflicts(manageNumber, timing, weekday, month, date, hour, editIndex ? Number(editIndex) : null);
  showConflictAlert(conflicts);
  if (conflicts.length > 0 && !document.getElementById('sched-confirm-flag')) {
    var flag = document.createElement('span');
    flag.id = 'sched-confirm-flag';
    flag.style.display = 'none';
    document.getElementById('btn-sched-save').appendChild(flag);
    showStatus(document.getElementById('sched-save-status'), 'info', '重複を確認の上、もう一度「保存」を押すと保存します');
    return;
  }
  var flag = document.getElementById('sched-confirm-flag');
  if (flag) flag.parentNode.removeChild(flag);

  var sched = {
    index: editIndex ? Number(editIndex) : null,
    manageNumber: manageNumber,
    timing: timing,
    weekday: timing === 'weekly' ? weekday : '',
    month: timing === 'yearly' ? month : '',
    date: timing === 'yearly' ? date : '',
    hour: hour,
    ltName: ltName
  };

  document.getElementById('btn-sched-save').disabled = true;
  showStatus(document.getElementById('sched-save-status'), 'loading', '保存中...');

  callGas('saveSchedule', { schedule: JSON.stringify(sched) })
    .then(function(data) {
      document.getElementById('btn-sched-save').disabled = false;
      if (data.error) { showStatus(document.getElementById('sched-save-status'), 'error', data.error); return; }
      document.getElementById('sched-form-card').style.display = 'none';
      document.getElementById('sched-conflict-alert').style.display = 'none';
      document.getElementById('sched-save-status').className = 'status';
      loadSchedules();
    })
    .catch(function(err) {
      document.getElementById('btn-sched-save').disabled = false;
      showStatus(document.getElementById('sched-save-status'), 'error', '通信エラー: ' + err.message);
    });
});

// キャンセル
document.getElementById('btn-sched-cancel').addEventListener('click', function() {
  document.getElementById('sched-form-card').style.display = 'none';
  document.getElementById('sched-conflict-alert').style.display = 'none';
  document.getElementById('sched-save-status').className = 'status';
  var flag = document.getElementById('sched-confirm-flag');
  if (flag) flag.parentNode.removeChild(flag);
});

// 削除
function deleteSchedule(index) {
  var sc = schedules.find(function(s) { return s.index === index; });
  if (!sc) return;
  var timingLabel = sc.timing === 'weekly'
    ? '毎週' + WEEKDAY_NAMES[sc.weekday] : sc.month + '月' + sc.date + '日';
  if (!confirm(sc.manageNumber + ' / ' + timingLabel + ' ' + sc.hour + ':00\nこのスケジュールを削除しますか？')) return;

  showStatus(document.getElementById('sched-save-status'), 'loading', '削除中...');
  callGas('deleteSchedule', { index: index })
    .then(function(data) {
      if (data.error) { showStatus(document.getElementById('sched-save-status'), 'error', data.error); return; }
      document.getElementById('sched-save-status').className = 'status';
      loadSchedules();
    })
    .catch(function(err) {
      showStatus(document.getElementById('sched-save-status'), 'error', '通信エラー: ' + err.message);
    });
}
</script>
</body>
